version: "3.9"

# ============================================================
#  LogWatch v2 — stack completa
#
#  Profiles disponíveis (sobe sob demanda com `--profile <nome>`):
#    agent       — sobe o agent monitorando o próprio host
# ============================================================

services:
  # --- Banco de dados principal (TimescaleDB) ---
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Postgres NÃO é exposto no host — acesso apenas via rede interna do Compose.
    # Para acesso pontual via psql, use `docker compose exec postgres psql -U $POSTGRES_USER`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    # A rotina de limpeza de bloat (pg_repack, todo dia às 3h) roda DENTRO do
    # backend (ver backend/src/db-maintenance), não aqui — sem sidecar extra
    # de scheduler. A imagem custom acima (Dockerfile.postgres) só garante que
    # a extensão pg_repack já vem instalada no servidor.

  # --- Cache / fila ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Backend NestJS ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # --- Frontend Next.js ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      # Necessário para o `next start` standalone bind no 0.0.0.0
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Agent local (opcional) ---
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOGWATCH_BASE_URL: http://127.0.0.1:4000/api
      LOGWATCH_API_KEY: ${LOGWATCH_DEMO_API_KEY:-}
      LOGWATCH_SERVER_NAME: local-host
      LOGWATCH_HOST_ROOT: /host
      LOGWATCH_ALLOWED_PATHS: ${LOGWATCH_ALLOWED_PATHS:-/}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:rw,rslave
    pid: "host"
    network_mode: "host"
    # GID do grupo `docker` do host. Descubra com:
    #   stat -c '%g' /var/run/docker.sock
    # e exporte como DOCKER_GID antes de subir o agent.
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      - backend
    profiles: ["agent"]

volumes:
  pg_data:
