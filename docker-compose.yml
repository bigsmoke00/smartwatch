version: "3.9"

# ============================================================
#  SmartGard — stack completa, com imagens do Docker Hub (digivoxbr)
#
#  No servidor (baixa backend/frontend prontos; só o postgres é buildado local):
#    docker login                      # os repositórios digivoxbr são privados
#    docker compose pull backend frontend
#    docker compose up -d
#
#  Para publicar uma versão nova (na máquina de build):
#    SMARTGARD_TAG=1.7 docker compose build
#    SMARTGARD_TAG=1.7 docker compose push
#  (ou use ./docker/publish.sh 1.7)
#
#  Imagens e tags são configuráveis no .env:
#    SMARTGARD_REGISTRY=digivoxbr   SMARTGARD_TAG=1.7   AGENT_TAG=1.7
#
#  Profiles disponíveis (sobe sob demanda com `--profile <nome>`):
#    agent       — sobe o agent monitorando o próprio host
# ============================================================

x-restart: &restart
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  # --- Banco de dados principal (TimescaleDB + pg_repack) ---
  postgres:
    <<: *restart
    # Não há imagem do postgres no Docker Hub: é buildada no servidor (TimescaleDB
    # + pg_repack, Dockerfile.postgres). Nome local, fora do registry, para o
    # `docker compose pull` não tentar baixar.
    image: smartgard-postgres:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Postgres NÃO é exposto no host — acesso apenas via rede interna do Compose.
    # Para acesso pontual via psql, use `docker compose exec postgres psql -U $POSTGRES_USER`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- Cache ---
  redis:
    <<: *restart
    image: redis:7-alpine
    # Só cache: teto de memória + LRU e sem snapshot em disco.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Ajusta o dono da pasta de capturas antes do backend subir ---
  # O backend roda como usuário não-root (uid 1000). Se ./capturas_sip pertence ao
  # root, a captura não consegue gravar o .pcap. Este passo roda a cada `up`.
  capturas-perms:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:1000 /data/captures && chmod 750 /data/captures"]
    volumes:
      - ./capturas_sip:/data/captures
    restart: "no"

  # --- Backend NestJS ---
  backend:
    <<: *restart
    image: ${SMARTGARD_REGISTRY:-digivoxbr}/smartgard-backend:${SMARTGARD_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      # .pcap das capturas (retenção de 7 dias). O alvo precisa casar com
      # CAPTURE_STORAGE_DIR no .env (padrão /data/captures).
      - ./capturas_sip:/data/captures
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      capturas-perms: { condition: service_completed_successfully }

  # --- Frontend Next.js ---
  # A imagem é genérica: o endereço da API/WebSocket é lido QUANDO O CONTAINER SOBE.
  #   - sem nada definido: usa o próprio domínio (/api e o host atual) — o normal atrás do nginx;
  #   - para outro domínio: SMARTGARD_API_URL=https://x/api e SMARTGARD_WS_URL=https://x
  #     (NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL do .env também valem, em runtime).
  # Conferir: curl http://127.0.0.1:${FRONTEND_PORT:-3000}/healthz  ou  docker compose logs frontend
  frontend:
    <<: *restart
    image: ${SMARTGARD_REGISTRY:-digivoxbr}/smartgard-frontend:${SMARTGARD_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Agent local (opcional) ---
  agent:
    image: ${SMARTGARD_REGISTRY:-digivoxbr}/smartgard-agent:${AGENT_TAG:-1.6}
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOGWATCH_BASE_URL: http://127.0.0.1:4000/api
      LOGWATCH_API_KEY: ${LOGWATCH_DEMO_API_KEY:-}
      LOGWATCH_SERVER_NAME: local-host
      LOGWATCH_HOST_ROOT: /host
      LOGWATCH_ALLOWED_PATHS: ${LOGWATCH_ALLOWED_PATHS:-/}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:rw,rslave
    pid: "host"
    network_mode: "host"
    # GID do grupo `docker` do host: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      - backend
    profiles: ["agent"]

volumes:
  pg_data:
